<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div class="nav_div">
        Welcome to Interactive Quiz
    </div>

    <div class="main_contain">
        <div class="que_no" id="que_no_id">
            Question No.1
        </div> 
        <div class="progress_bar">
            <div class="progress" id="progress_bar_id" role="progressbar" aria-label="Animated striped example" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="margin-top: 10px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%;background-color: green;"></div>
              </div>
              </div>

              <div class="que_dis" id="que_dis_id">
                Name of India Capital City ? 
              </div>

              <div class="ans_div">
                <ul class="list-group" style="margin-bottom: 5px;">
                    <li class="list-group-item" id="list-group-item_id">
                      <input class="form-check-input me-1" type="radio" name="listGroupRadio" value="" id="firstRadio" >
                      <label class="form-check-label" for="firstRadio">Delhi</label>
                    </li>
                    <li class="list-group-item" id="list-group-item_id" >
                      <input class="form-check-input me-1" type="radio" name="listGroupRadio" value="" id="secondRadio" >
                      <label class="form-check-label" for="secondRadio" >Mumbai</label>
                    </li>
                    <li class="list-group-item" id="list-group-item_id">
                      <input class="form-check-input me-1" type="radio" name="listGroupRadio" value="" id="thirdRadio" >
                      <label class="form-check-label" for="thirdRadio">Nagpur</label>
                    </li>
                    <li class="list-group-item" id="list-group-item_id">
                        <input class="form-check-input me-1" type="radio" name="listGroupRadio" value="" id="thirdRadio" >
                        <label class="form-check-label" for="thirdRadio">Pune</label>
                      </li>
                  </ul>
              </div>

              <div class="sub_but_div">
                <button class="sub_but">Submit Answer</button>
              </div>
        </div>

        
        <script src="index.js"></script>
</body>
</html>
